name: openair
description: OpenAir Fitbit companion with recovery, strain, sleep coaching, and Google Health sync.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  google_sign_in: ^6.3.0
  http: ^1.4.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  google_generative_ai: ^0.4.7
  fl_chart: ^1.0.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  provider: ^6.1.5
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#0B3D2E"
  adaptive_icon_foreground: assets/branding/icon.png
  remove_alpha_ios: true
