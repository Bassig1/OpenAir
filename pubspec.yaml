name: openair
description: Whoop-inspired Fitbit companion powered by Google Health API and Gemini.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  google_sign_in: ^6.3.0
  http: ^1.4.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  google_generative_ai: ^0.4.7
  fl_chart: ^1.0.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  provider: ^6.1.5
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
